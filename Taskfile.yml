version: '3'

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  format:
    desc: Format the Go code
    cmds:
      - go fix ./...
      - go fmt ./...

  build:
    desc: Build the console demo program
    cmds:
      - go build -o codemode-demo{{exeExt}} ./cmd/demo

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  demo:
    desc: Run the console demo program
    cmds:
      - go run ./cmd/demo

  lint:
    desc: Run golangci-lint in a Docker container
    cmds:
      - golangci-lint run -v --timeout 5m

